<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContactHub - My Contacts</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a4f8a;
    }

    /* ── Topbar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
    }
    .logo-sm { font-size: 18px; font-weight: 700; color: #fff; }
    .logo-sm span { color: #5aaeff; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .user-greeting { font-size: 14px; color: rgba(255,255,255,0.6); }
    .btn-icon {
      background: none; border: none; cursor: pointer;
      font-size: 20px; color: rgba(255,255,255,0.6);
      padding: 6px; border-radius: 6px; display: flex; align-items: center;
      transition: background 0.1s, color 0.1s;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* ── Main wrapper below topbar ── */
    #main-wrapper {
      position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0;
      display: flex;
      gap: 16px;
      padding: 16px;
      background: #1a4f8a;
    }

    /* ── Left panel ── */
    #panel-list {
      width: 320px;
      flex-shrink: 0;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Right panel ── */
    #panel-detail {
      flex: 1;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* ── Search ── */
    .search-wrap { padding: 12px; border-bottom: 1px solid #e8f1fb; flex-shrink: 0; }
    .search-icon-wrap { position: relative; }
    .search-icon-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #999; pointer-events: none; }
    .search-icon-wrap input {
      width: 100%; padding: 9px 12px 9px 34px;
      border: 1.5px solid #d0e4f7; border-radius: 8px;
      background: #f5faff; color: #0a0a0a;
      font-size: 14px; font-family: inherit;
    }
    .search-icon-wrap input:focus { outline: none; border-color: #1a6fb5; background: #fff; }

    /* ── List meta ── */
    .list-meta {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-bottom: 1px solid #e8f1fb;
      font-size: 12px; color: #999; flex-shrink: 0;
    }
    .btn-add-sm {
      background: #0a0a0a; border: none;
      border-radius: 6px; padding: 5px 12px; font-size: 13px;
      font-weight: 600; cursor: pointer; color: #fff;
      display: flex; align-items: center; gap: 4px; font-family: inherit;
      transition: background 0.15s;
    }
    .btn-add-sm:hover { background: #1a4f8a; }

    /* ── Contacts list ── */
    #contacts-list { list-style: none; flex: 1; overflow-y: auto; }
    .contact-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border-bottom: 1px solid #e8f1fb;
      cursor: pointer; transition: background 0.1s;
    }
    .contact-item:hover, .contact-item.active { background: #f0f7ff; }
    .contact-item .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: #ddeeff; color: #1a4f8a;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .contact-meta { flex: 1; min-width: 0; }
    .contact-name { font-size: 15px; font-weight: 500; margin-bottom: 2px; color: #0a0a0a; }
    .contact-sub { font-size: 13px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Empty state ── */
    #empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 3rem; text-align: center;
      color: #999; font-size: 14px; gap: 8px; flex: 1;
    }
    #empty-state i { font-size: 44px; color: #ccc; }

    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* ── Detail placeholder ── */
    #detail-placeholder {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: #aaa; font-size: 14px;
    }
    #detail-placeholder i { font-size: 48px; color: #ccc; }

    /* ── Detail view ── */
    #detail-view { display: flex; flex-direction: column; flex: 1; }
    .detail-hero {
      display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1.5rem 1.5rem; border-bottom: 1px solid #e8f1fb;
    }
    .avatar-lg {
      width: 72px; height: 72px; border-radius: 50%;
      background: #ddeeff; color: #1a4f8a;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; margin-bottom: 12px;
    }
    .detail-name { font-size: 22px; font-weight: 600; margin: 0; color: #0a0a0a; }
    .detail-rel { font-size: 14px; color: #666; margin: 4px 0 0; }
    .detail-fields { flex: 1; }
    .detail-row {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 1.5rem; border-bottom: 1px solid #e8f1fb;
    }
    .detail-row i { font-size: 18px; color: #1a6fb5; margin-top: 2px; flex-shrink: 0; }
    .detail-row-inner { flex: 1; }
    .detail-label { font-size: 12px; color: #999; margin-bottom: 2px; }
    .detail-val { font-size: 15px; color: #0a0a0a; }
    .action-row {
      display: flex; gap: 10px;
      padding: 1.25rem 1.5rem; border-top: 1px solid #e8f1fb;
    }
    .btn-del {
      flex: 1; padding: 11px; background: none; color: #c0392b;
      border: 1px solid rgba(192,57,43,0.3); border-radius: 8px;
      font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-del:hover { background: #fdf1f0; }
    .btn-edit-action {
      flex: 1; padding: 11px; background: #0a0a0a; color: #fff;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 0.15s;
    }
    .btn-edit-action:hover { background: #1a4f8a; }

    /* ── Form view ── */
    #form-view { display: flex; flex-direction: column; flex: 1; }
    .form-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 1.5rem; border-bottom: 1px solid #e8f1fb;
      position: sticky; top: 0; background: #fff; z-index: 5;
    }
    .form-title { font-size: 17px; font-weight: 600; margin: 0; color: #0a0a0a; }
    .btn-text-cancel {
      background: none; border: none; cursor: pointer;
      color: #666; font-size: 14px; padding: 6px 8px;
      border-radius: 6px; font-family: inherit;
    }
    .btn-text-cancel:hover { color: #0a0a0a; }
    .msg { font-size: 13px; padding: 9px 12px; border-radius: 8px; margin-bottom: 1rem; }
    .msg-error { background: #fdf1f0; color: #c0392b; }
    .form-body { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem 3rem; }
    .section-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
      color: #999; margin: 1.5rem 0 0.65rem;
    }
    .section-label:first-child { margin-top: 0; }
    .field-group { margin-bottom: 1rem; }
    .field-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
    .field-group input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid #d0e4f7; border-radius: 8px;
      background: #f5faff; color: #0a0a0a;
      font-size: 15px; font-family: inherit;
    }
    .field-group input:focus { outline: none; border-color: #1a6fb5; background: #fff; }
    .btn-primary {
      display: block; width: 100%; padding: 13px; margin-top: 1.5rem;
      background: #0a0a0a; color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #1a4f8a; }

    /* ── Responsive ── */
    @media (max-width: 680px) {
      #main-wrapper { flex-direction: column; }
      #panel-list { width: 100%; flex: 0 0 45%; }
      #panel-detail { flex: 1; }
    }
  </style>
</head>
<body class="page-contacts">

  <header id="topbar" role="banner">
    <span class="logo-sm">Contact<span>Hub</span></span>
    <nav class="topbar-right" aria-label="User actions">
      <span class="user-greeting" id="user-greeting"></span>
      <button class="btn-icon" id="btn-logout" aria-label="Logout" type="button">
        <i class="ti ti-logout" aria-hidden="true"></i>
      </button>
    </nav>
  </header>

  <div id="main-wrapper">

    <!-- LEFT PANEL -->
    <div id="panel-list" aria-label="Contacts list">

      <div class="search-wrap">
        <label for="search-input" class="sr-only">Search contacts</label>
        <div class="search-icon-wrap">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="search" id="search-input" placeholder="Search contacts..." autocomplete="off" />
        </div>
      </div>

      <div class="list-meta">
        <span id="contact-count">0 contacts</span>
        <button class="btn-add-sm" id="btn-add-contact" type="button">
          <i class="ti ti-plus" aria-hidden="true"></i> Add
        </button>
      </div>

      <ul id="contacts-list" role="list" aria-live="polite"></ul>

      <div id="empty-state" class="hidden" aria-live="polite">
        <i class="ti ti-users" aria-hidden="true"></i>
        <p>No contacts found.</p>
        <p style="font-size:13px; color:#bbb;">Tap Add to create your first one.</p>
      </div>

    </div>

    <!-- RIGHT PANEL -->
    <div id="panel-detail" aria-label="Contact detail">

      <div id="detail-placeholder">
        <i class="ti ti-address-book" aria-hidden="true"></i>
        <p>Select a contact to view details</p>
      </div>

      <!-- DETAIL VIEW -->
      <div id="detail-view" class="hidden">
        <div class="detail-hero">
          <div class="avatar-lg" id="detail-avatar"></div>
          <h1 class="detail-name" id="detail-name"></h1>
          <p class="detail-rel" id="detail-rel"></p>
        </div>
        <div class="detail-fields">
          <div class="detail-row">
            <i class="ti ti-mail" aria-hidden="true"></i>
            <div class="detail-row-inner">
              <p class="detail-label">Email</p>
              <p class="detail-val" id="detail-email"></p>
            </div>
          </div>
          <div class="detail-row">
            <i class="ti ti-phone" aria-hidden="true"></i>
            <div class="detail-row-inner">
              <p class="detail-label">Phone</p>
              <p class="detail-val" id="detail-phone"></p>
            </div>
          </div>
          <div class="detail-row">
            <i class="ti ti-map-pin" aria-hidden="true"></i>
            <div class="detail-row-inner">
              <p class="detail-label">Address</p>
              <p class="detail-val" id="detail-address"></p>
            </div>
          </div>
          <div class="detail-row">
            <i class="ti ti-notes" aria-hidden="true"></i>
            <div class="detail-row-inner">
              <p class="detail-label">Notes</p>
              <p class="detail-val" id="detail-notes"></p>
            </div>
          </div>
        </div>
        <div class="action-row">
          <button class="btn-del" id="btn-delete" type="button">
            <i class="ti ti-trash" aria-hidden="true"></i> Delete
          </button>
          <button class="btn-edit-action" id="btn-edit" type="button">
            <i class="ti ti-edit" aria-hidden="true"></i> Edit
          </button>
        </div>
      </div>

      <!-- ADD / EDIT FORM -->
      <div id="form-view" class="hidden">
        <div class="form-topbar">
          <h2 class="form-title" id="form-title">New Contact</h2>
          <button class="btn-text-cancel" id="btn-cancel-form" type="button">Cancel</button>
        </div>
        <div class="msg msg-error hidden" id="form-error" role="alert" aria-live="polite">
          Could not save contact. Please try again.
        </div>
        <div class="form-body">
          <p class="section-label">Basic info</p>
          <div class="field-group">
            <label for="form-firstname">First name</label>
            <input type="text" id="form-firstname" placeholder="Jane" autocomplete="given-name" />
          </div>
          <div class="field-group">
            <label for="form-lastname">Last name</label>
            <input type="text" id="form-lastname" placeholder="Doe" autocomplete="family-name" />
          </div>
          <div class="field-group">
            <label for="form-rel">Relationship</label>
            <input type="text" id="form-rel" placeholder="Friend, colleague, family..." />
          </div>
          <p class="section-label">Contact info</p>
          <div class="field-group">
            <label for="form-email">Email address</label>
            <input type="email" id="form-email" placeholder="name@email.com" autocomplete="email" />
          </div>
          <div class="field-group">
            <label for="form-phone">Phone number</label>
            <input type="tel" id="form-phone" placeholder="(555) 000-0000" autocomplete="tel" />
          </div>
          <div class="field-group">
            <label for="form-address">Address</label>
            <input type="text" id="form-address" placeholder="Street, city, state, zip" autocomplete="street-address" />
          </div>
          <p class="section-label">Notes</p>
          <div class="field-group">
            <label for="form-notes">Notes</label>
            <input type="text" id="form-notes" placeholder="How you met, birthday, anything useful..." />
          </div>
          <button class="btn-primary" id="btn-save-contact" type="button">Save contact</button>
        </div>
      </div>

    </div>

  </div>

  <script src="js/contacts.js"></script>

</body>
</html>
