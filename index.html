<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContactHub</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f4f2;
      color: #1a1917;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .landing-wrap {
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.5rem;
    }

    .landing-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #dddad6;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #1a1917;
    }
    .logo span { color: #3a3733; }

    .landing-sub {
      font-size: 15px;
      color: #6b6760;
      margin-bottom: 2rem;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 12px;
      background: #1a1917;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 0.75rem;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #3a3733; }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 12px;
      background: #f0eeec;
      color: #1a1917;
      border: 1px solid #dddad6;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 2rem;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: #e5e3e0; }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 1rem;
      border-top: 1px solid #dddad6;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #6b6760;
    }

    .feature-item i {
      font-size: 18px;
      color: #3a3733;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="page-landing">

  <main class="landing-wrap">
    <div class="landing-card">

      <div class="logo">Contact<span>Hub</span></div>
      <p class="landing-sub">Your personal contact manager.</p>

      <a href="login.html" class="btn-primary" id="btn-go-login">Sign in</a>
      <a href="login.html#register" class="btn-secondary" id="btn-go-register">Create account</a>

      <div class="feature-list">
        <div class="feature-item">
          <i class="ti ti-lock" aria-hidden="true"></i>
          <span>Private contacts, only visible to you</span>
        </div>
        <div class="feature-item">
          <i class="ti ti-search" aria-hidden="true"></i>
          <span>Fast server-side search</span>
        </div>
        <div class="feature-item">
          <i class="ti ti-shield-check" aria-hidden="true"></i>
          <span>Passwords hashed and secured</span>
        </div>
      </div>

    </div>
  </main>

  <script src="js/index.js"></script>

</body>
</html>
