<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContactHub</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a4f8a;
      color: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      top: -80px;
      left: -80px;
      transform: rotate(20deg);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      bottom: -60px;
      right: -60px;
      transform: rotate(-15deg);
      pointer-events: none;
    }

    .bg-square-1 {
      position: fixed;
      width: 160px;
      height: 160px;
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      top: 60px;
      right: 120px;
      transform: rotate(30deg);
      pointer-events: none;
    }
    .bg-square-2 {
      position: fixed;
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      bottom: 100px;
      left: 100px;
      transform: rotate(-10deg);
      pointer-events: none;
    }

    .landing-wrap {
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    .landing-card {
      background: #ffffff;
      border-radius: 20px;
      border: none;
      padding: 2.75rem 2.25rem;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.3),
        0 8px 20px rgba(0,0,0,0.15);
    }

    .logo {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      color: #0a0a0a;
      text-align: center;
    }
    .logo span { color: #1a6fb5; }

    .landing-sub {
      font-size: 14px;
      color: #666;
      margin-bottom: 2rem;
      text-align: center;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 13px;
      background: #0a0a0a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 0.75rem;
      font-family: inherit;
      letter-spacing: 0.2px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: #1a4f8a; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 13px;
      background: #f5faff;
      color: #0a0a0a;
      border: 1.5px solid #d0e4f7;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 2rem;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-secondary:hover { background: #e8f1fb; transform: translateY(-1px); }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 1.25rem;
      border-top: 1px solid #e8f1fb;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #555;
    }

    .feature-item i {
      font-size: 18px;
      color: #1a6fb5;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="page-landing">

  <div class="bg-square-1"></div>
  <div class="bg-square-2"></div>

  <main class="landing-wrap">
    <div class="landing-card">

      <div class="logo">Contact<span>Hub</span></div>
      <p class="landing-sub">Your personal contact manager.</p>

      <a href="login.html" class="btn-primary" id="btn-go-login">Sign in</a>
      <a href="login.html#register" class="btn-secondary" id="btn-go-register">Create account</a>

      <div class="feature-list">
        <div class="feature-item">
          <i class="ti ti-lock" aria-hidden="true"></i>
          <span>Private contacts, only visible to you</span>
        </div>
        <div class="feature-item">
          <i class="ti ti-search" aria-hidden="true"></i>
          <span>Fast server-side search</span>
        </div>
        <div class="feature-item">
          <i class="ti ti-shield-check" aria-hidden="true"></i>
          <span>Passwords hashed and secured</span>
        </div>
      </div>

    </div>
  </main>

  <script src="js/index.js"></script>

</body>
</html>
